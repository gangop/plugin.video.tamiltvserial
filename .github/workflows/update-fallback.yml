name: Update TamilDhool fallback index

on:
  workflow_dispatch:
  schedule:
    # Full refresh (episode index + serials menu) every 6 hours.
    # Do not add a second cron at 06:20 — it double-fires with this schedule
    # and the two jobs race on git push (one succeeds, one fails).
    - cron: '20 */6 * * *'

# Prevent overlapping schedule/manual runs from racing on the same branch tip.
concurrency:
  group: update-tamildhool-fallback
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install updater dependencies
        run: python -m pip install --upgrade cloudscraper

      - name: Refresh fallback index and consolidated serials menu
        run: python scripts/update_tamildhool_fallback.py

      - name: Commit refreshed index
        run: |
          if git diff --quiet -- \
              fallback/tamildhool.json \
              fallback/active_serials.json \
              plugin.video.tamiltvserial/resources/data/active_serials.json; then
            echo "No fallback index changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fallback/tamildhool.json fallback/active_serials.json \
            plugin.video.tamiltvserial/resources/data/active_serials.json \
            fallback/show_aliases.json
          git commit -m "Refresh TamilDhool fallback index and consolidated serials menu"
          # Rebase if another run pushed while we were scraping.
          git pull --rebase origin main
          git push
          # jsDelivr @main can keep a stale active_serials.json without recent_episodes.
          curl -fsS "https://purge.jsdelivr.net/gh/gangop/plugin.video.tamiltvserial@main/fallback/active_serials.json" \
            || echo "jsDelivr purge skipped/failed"
          curl -fsS "https://purge.jsdelivr.net/gh/gangop/plugin.video.tamiltvserial@main/fallback/tamildhool.json" \
            || echo "jsDelivr purge skipped/failed"
